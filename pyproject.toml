[project]
name = "research-extract-pdf-papers"
version = "0.1.0"
description = "Research paper assistant with MCP tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=2.4.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "litellm>=1.82.2",
    "mcp>=1.26.0",
    "pymupdf4llm>=1.27.2.1",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "resend>=2.30.1",
    "supabase>=2.31.0",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
